<svg width="1000" height="460" viewBox="0 0 1000 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">API pricing comparison</title>
  <desc id="desc">Vertical rounded bar chart comparing public output-token prices per one million tokens, with Sukoon marked TBD as a small target bar.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="0.45" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCA5A5"/>
      <stop offset="0.35" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1000" height="460" rx="22" fill="#111111"/>
  <text x="48" y="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFF7ED">API Price Reference</text>
  <text x="48" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D6D3D1">Public output-token prices per 1M tokens. Sukoon is shown as the intended low-cost specialist lane until public pricing is finalized.</text>

  <g transform="translate(112 120)">
    <line x1="0" y1="250" x2="776" y2="250" stroke="#57534E" stroke-width="2"/>
    <line x1="0" y1="167" x2="776" y2="167" stroke="#292524" stroke-width="1"/>
    <line x1="0" y1="83" x2="776" y2="83" stroke="#292524" stroke-width="1"/>
    <text x="-16" y="255" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#A8A29E">$0</text>
    <text x="-16" y="172" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#A8A29E">$10</text>
    <text x="-16" y="88" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#A8A29E">$20</text>
    <text x="-16" y="5" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#A8A29E">$30</text>

    <g transform="translate(94 0)" filter="url(#softShadow)">
      <rect x="-44" y="214" width="88" height="36" rx="12" fill="url(#orange)"/>
      <rect x="-44" y="214" width="88" height="36" rx="12" fill="#FED7AA" opacity="0.12"/>
      <text x="0" y="197" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FDBA74">TBD</text>
      <text x="0" y="286" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FDBA74">Sukoon</text>
      <text x="0" y="309" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#D6D3D1">specialist tier</text>
    </g>

    <g transform="translate(388 0)" filter="url(#softShadow)">
      <rect x="-58" y="42" width="116" height="208" rx="18" fill="url(#red)"/>
      <rect x="-58" y="42" width="116" height="208" rx="18" fill="#FEE2E2" opacity="0.1"/>
      <text x="0" y="25" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFF7ED">$25</text>
      <text x="0" y="286" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FCA5A5">Claude Opus 4.7</text>
      <text x="0" y="309" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#D6D3D1">output / 1M tokens</text>
    </g>

    <g transform="translate(682 0)" filter="url(#softShadow)">
      <rect x="-58" y="0" width="116" height="250" rx="18" fill="url(#orange)"/>
      <rect x="-58" y="0" width="116" height="250" rx="18" fill="#FED7AA" opacity="0.12"/>
      <text x="0" y="-17" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFF7ED">$30</text>
      <text x="0" y="286" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FDBA74">GPT-5.5</text>
      <text x="0" y="309" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#D6D3D1">output / 1M tokens</text>
    </g>
  </g>

  <text x="48" y="426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#A8A29E">Sukoon bar is intentionally not a quoted price. It communicates target positioning until public API pricing is finalized.</text>
</svg>
