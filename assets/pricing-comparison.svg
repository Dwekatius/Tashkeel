<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">API pricing comparison</title>
  <desc id="desc">Illustrative per one million output token pricing comparison with Sukoon marked TBD as a small target bar.</desc>
  <rect width="1000" height="360" rx="22" fill="#111111"/>
  <text x="48" y="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFF7ED">API Price Reference</text>
  <text x="48" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D6D3D1">Public output-token prices per 1M tokens. Sukoon commercial pricing is TBD and shown as the intended low-cost specialist lane.</text>
  <g transform="translate(88 126)">
    <text x="0" y="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FDBA74">Sukoon</text>
    <rect x="210" y="3" width="650" height="26" rx="13" fill="#292524"/>
    <rect x="210" y="3" width="34" height="26" rx="13" fill="#F97316"/>
    <text x="878" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FDBA74">TBD</text>
  </g>
  <g transform="translate(88 190)">
    <text x="0" y="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FCA5A5">Claude Opus 4.7</text>
    <rect x="210" y="3" width="650" height="26" rx="13" fill="#292524"/>
    <rect x="210" y="3" width="542" height="26" rx="13" fill="#DC2626"/>
    <text x="878" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFF7ED">$25</text>
  </g>
  <g transform="translate(88 254)">
    <text x="0" y="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FDBA74">GPT-5.5</text>
    <rect x="210" y="3" width="650" height="26" rx="13" fill="#292524"/>
    <rect x="210" y="3" width="650" height="26" rx="13" fill="#F97316"/>
    <text x="878" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFF7ED">$30</text>
  </g>
  <text x="48" y="328" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#A8A29E">Sukoon bar is intentionally not a quoted price. It communicates target positioning until public API pricing is finalized.</text>
</svg>
