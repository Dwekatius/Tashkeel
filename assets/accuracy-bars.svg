<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sukoon accuracy bars</title>
  <desc id="desc">Horizontal bars for DER quality 98.92 percent and WER quality 96.54 percent.</desc>
  <rect width="1000" height="250" rx="22" fill="#0F172A"/>
  <text x="48" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="900" fill="#F8FAFC">Filtered Quality Scores</text>
  <text x="48" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#CBD5E1">Task-focused scoring after removing orthographic noise categories.</text>
  <g transform="translate(48 112)">
    <text x="0" y="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#A7F3D0">DER</text>
    <rect x="90" y="4" width="760" height="28" rx="14" fill="#1E293B"/>
    <rect x="90" y="4" width="752" height="28" rx="14" fill="#34D399"/>
    <text x="874" y="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#F8FAFC">98.92%</text>
  </g>
  <g transform="translate(48 166)">
    <text x="0" y="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#BFDBFE">WER</text>
    <rect x="90" y="4" width="760" height="28" rx="14" fill="#1E293B"/>
    <rect x="90" y="4" width="734" height="28" rx="14" fill="#60A5FA"/>
    <text x="874" y="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#F8FAFC">96.54%</text>
  </g>
</svg>
