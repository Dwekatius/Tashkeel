<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sukoon accuracy bars</title>
  <desc id="desc">Dark orange and red horizontal bars for DER quality 98.92 percent and WER quality 96.54 percent.</desc>
  <rect width="1000" height="250" rx="22" fill="#111111"/>
  <text x="48" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="900" fill="#FFF7ED">Filtered Quality Scores</text>
  <text x="48" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D6D3D1">Task-focused scoring after removing orthographic noise categories.</text>
  <g transform="translate(48 113)">
    <text x="0" y="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FDBA74">DER</text>
    <rect x="90" y="4" width="760" height="28" rx="14" fill="#292524"/>
    <rect x="90" y="4" width="752" height="28" rx="14" fill="#F97316"/>
    <text x="874" y="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFF7ED">98.92%</text>
  </g>
  <g transform="translate(48 168)">
    <text x="0" y="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FCA5A5">WER</text>
    <rect x="90" y="4" width="760" height="28" rx="14" fill="#292524"/>
    <rect x="90" y="4" width="734" height="28" rx="14" fill="#DC2626"/>
    <text x="874" y="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFF7ED">96.54%</text>
  </g>
</svg>
