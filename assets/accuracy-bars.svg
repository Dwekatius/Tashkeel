<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sukoon accuracy bars</title>
  <desc id="desc">Dark yellow and coral horizontal bars showing Sukoon DER quality 99.29 percent and WER quality 97 percent.</desc>
  <rect width="1000" height="240" rx="22" fill="#161514"/>
  <text x="48" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="900" fill="#FFF7ED">Tashkeel Quality</text>
  <text x="48" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D6D3D1">Task-aware DER/WER scoring on punctuation-correct Arabic text.</text>
  <g transform="translate(48 116)">
    <text x="0" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FBCD28">DER</text>
    <rect x="120" y="4" width="650" height="26" rx="13" fill="#342F2B"/>
    <rect x="120" y="4" width="645" height="26" rx="13" fill="#F59D32"/>
    <text x="800" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFF7ED">99.29%</text>
  </g>
  <g transform="translate(48 168)">
    <text x="0" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FA5746">WER</text>
    <rect x="120" y="4" width="650" height="26" rx="13" fill="#342F2B"/>
    <rect x="120" y="4" width="631" height="26" rx="13" fill="#E53646"/>
    <text x="800" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFF7ED">97.00%</text>
  </g>
</svg>
