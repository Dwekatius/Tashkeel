<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sukoon v2 Arabic Tashkeel Runtime</title>
  <desc id="desc">Hero visual summarizing accuracy, speed, cost efficiency, and local runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#10243D"/>
      <stop offset="1" stop-color="#0D342D"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="54" x2="1018" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="0.48" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M63 283C177 217 215 80 366 103C489 122 492 229 612 222C742 214 753 86 883 78C1015 70 1057 201 1135 166" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
