    <text x="92" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#2563EB">Arabic tashkeel runtime for fast local deployment</text>
    <text x="92" y="211" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">Specialized diacritization beats general-purpose LLM overhead on cost, latency, privacy, and control.</text>
