<svg width="1000" height="470" viewBox="0 0 1000 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arabic tashkeel production fit map</title>
  <desc id="desc">A non-overlapping control and cost positioning map showing Sukoon, frontier LLM APIs, local 30B LLMs, and rule-only systems.</desc>
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="760" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1000" height="470" rx="22" fill="#111111"/>
  <text x="48" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="900" fill="#FFF7ED">Arabic Tashkeel Production Fit</text>
  <text x="48" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#D6D3D1">Lower cost and higher output control are better for high-volume tashkeel pipelines.</text>

  <g transform="translate(110 112)">
    <rect x="0" y="0" width="760" height="280" rx="18" fill="#171717" stroke="#44403C"/>
    <rect x="0" y="0" width="380" height="140" rx="18" fill="#2A120A" opacity="0.52"/>
    <rect x="380" y="0" width="380" height="140" rx="18" fill="#2A0F0F" opacity="0.46"/>
    <rect x="0" y="140" width="380" height="140" rx="18" fill="#1C1917" opacity="0.55"/>
    <rect x="380" y="140" width="380" height="140" rx="18" fill="#19191B" opacity="0.5"/>
    <line x1="380" y1="0" x2="380" y2="280" stroke="#57534E" stroke-width="2"/>
    <line x1="0" y1="140" x2="760" y2="140" stroke="#57534E" stroke-width="2"/>

    <text x="26" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FDBA74">Specialist advantage</text>
    <text x="565" y="32" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FCA5A5">Powerful but expensive</text>
    <text x="26" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#A8A29E">Weak fit</text>
    <text x="565" y="256" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#A8A29E">Cheap but unstable</text>

    <path d="M0 294H760" stroke="#78716C" stroke-width="2"/>
    <path d="M-14 280V0" stroke="#78716C" stroke-width="2"/>
    <text x="0" y="326" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D6D3D1">Low cost</text>
    <text x="760" y="326" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D6D3D1">High cost</text>
    <text x="-52" y="284" transform="rotate(-90 -52 284)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D6D3D1">Low control</text>
    <text x="-52" y="76" transform="rotate(-90 -52 76)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#D6D3D1">High control</text>

    <g filter="url(#shadow)">
      <circle cx="82" cy="86" r="12" fill="url(#hot)"/>
      <rect x="112" y="58" width="158" height="44" rx="10" fill="#24110C" stroke="#FB923C"/>
      <path d="M94 84L112 80" stroke="#FB923C" stroke-width="2"/>
      <text x="128" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFF7ED">Sukoon</text>
    </g>

    <g filter="url(#shadow)">
      <circle cx="623" cy="126" r="10" fill="#FCA5A5"/>
      <rect x="430" y="70" width="168" height="44" rx="10" fill="#2A0F0F" stroke="#EF4444"/>
      <path d="M598 94L616 119" stroke="#EF4444" stroke-width="2"/>
      <text x="446" y="97" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFF7ED">Frontier LLM API</text>
    </g>

    <g filter="url(#shadow)">
      <circle cx="524" cy="148" r="10" fill="#FED7AA"/>
      <rect x="550" y="154" width="152" height="44" rx="10" fill="#24110C" stroke="#F97316"/>
      <path d="M533 153L558 169" stroke="#F97316" stroke-width="2"/>
      <text x="566" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFF7ED">Local 30B+ LLM</text>
    </g>

    <g filter="url(#shadow)">
      <circle cx="76" cy="202" r="10" fill="#A8A29E"/>
      <rect x="104" y="178" width="132" height="44" rx="10" fill="#1C1917" stroke="#57534E"/>
      <path d="M85 199L104 199" stroke="#78716C" stroke-width="2"/>
      <text x="120" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFF7ED">Rule-only</text>
    </g>
  </g>
</svg>
